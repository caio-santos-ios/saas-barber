<div class="auth-container">
  <div class="auth-card confirm-card">
    <div class="auth-header">
      <img src="/logo.png" alt="Na Régua" class="auth-logo" />
    </div>

    <div *ngIf="state === 'loading'" class="status-content text-center">
      <div class="icon-wrapper loading-icon">
        <i class="fa-solid fa-spinner fa-spin"></i>
      </div>
      <h2>Confirmando sua conta</h2>
      <p>Aguarde um instante enquanto verificamos seu e-mail e ativamos seu acesso...</p>
    </div>

    <div *ngIf="state === 'success'" class="status-content text-center">
      <div class="icon-wrapper success-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h2>Conta Confirmada!</h2>
      <p>Sua conta foi confirmada e ativada com sucesso. Redirecionando para o login...</p>
      <button type="button" class="btn-primary auth-btn mt-4" (click)="goToLogin()">
        Acessar Painel
      </button>
    </div>

    <div *ngIf="state === 'error'" class="status-content text-center">
      <div class="icon-wrapper error-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h2>Falha na Confirmação</h2>
      <p>{{ errorMessage }}</p>
      <button type="button" class="btn-primary auth-btn mt-4" (click)="goToLogin()">
        Voltar para o Login
      </button>
    </div>

    <div class="auth-footer">
      <p>Precisa de ajuda? <a href="https://wa.me/5511965079106" target="_blank">Fale com o suporte</a></p>
    </div>
  </div>
</div>
