<div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Redefinir Senha</h1>
        <p>Crie uma nova senha para acessar sua conta.</p>
      </div>
  
      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="password">Nova Senha</label>
          <div class="password-input">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              name="password"
              [(ngModel)]="password"
              placeholder="Digite a nova senha"
              required>
            <button type="button" class="btn-icon" (click)="togglePassword()">
              <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">Confirmar Nova Senha</label>
            <div class="password-input">
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="confirmPassword" 
                name="confirmPassword"
                [(ngModel)]="confirmPassword"
                placeholder="Confirme a nova senha"
                required>
            </div>
          </div>
  
        <button type="submit" class="btn-primary" [disabled]="loading || !password || !confirmPassword || password !== confirmPassword">
          <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
          <span *ngIf="!loading">Redefinir Senha</span>
        </button>
      </form>
    </div>
  </div>
